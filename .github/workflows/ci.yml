name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # ubuntu-slim panics in oxlint type-aware allocator pool (oxc_allocator fixed_size.rs).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: pnpm-version
        uses: ./.github/actions/resolve-pnpm-version
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          install: false
          node-version-file: false
      - run: pnpm install --frozen-lockfile
      # A new yaml version fails here until vendor/ is regenerated with `pnpm run vendor`.
      - name: Vendored YAML parser matches the installed yaml
        run: |
          pnpm run vendor
          git diff --exit-code vendor/
      - run: pnpm run lint
      # actionlint is a pinned release binary, not an npm package: the npm wrapper pulls in adm-zip,
      # which has open advisories and no fixed release. ubuntu-latest has shellcheck preinstalled,
      # which actionlint runs on `run:` scripts.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/actionlint"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - run: pnpm run actionlint
      # The SQL rules in ast-rules/sql are tested against the real binary, a pinned release (the
      # test fails in CI when ast-grep is missing instead of skipping).
      - name: Install ast-grep
        env:
          AST_GREP_VERSION: 0.43.0
          AST_GREP_SHA256: a26253a9c821d935f7e383e40f0de7c2ca62a4121de1f73a6d81ec32eae631e0
        run: |
          archive="app-x86_64-unknown-linux-gnu.zip"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/$archive"
          echo "$AST_GREP_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/ast-grep"
          unzip -q "$RUNNER_TEMP/$archive" ast-grep -d "$RUNNER_TEMP/ast-grep"
          echo "$RUNNER_TEMP/ast-grep" >> "$GITHUB_PATH"
      - run: pnpm run typecheck
      # Coverage thresholds are 100% and enforced by vitest.config.mts.
      - run: pnpm run test:coverage

  links:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links in Markdown resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Offline: only links between files in this repository. Most external links here point
          # at private repositories, which answer 404 without a token.
          args: --no-progress --offline '*.md' 'docs/*.md' 'skills/**/*.md' 'benchmarks/*/*.md'
          fail: true
