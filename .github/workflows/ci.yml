name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # ubuntu-slim panics in oxlint type-aware allocator pool (oxc_allocator fixed_size.rs).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: pnpm-version
        uses: ./.github/actions/resolve-pnpm-version
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
          install: false
          node-version-file: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run actionlint
      - run: pnpm run typecheck
      # Coverage thresholds are 100% and enforced by vitest.config.mts.
      - run: pnpm run test:coverage
